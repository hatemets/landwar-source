# Local Postgres for LandWar. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: landwar
      POSTGRES_PASSWORD: landwar
      POSTGRES_DB: landwar_dev
    ports:
      - "5432:5432"
    volumes:
      - landwar-pgdata:/var/lib/postgresql/data

volumes:
  landwar-pgdata:
