name: 🧪 CI

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/setup@v3
        with:
          version: 11.1.0
          runtime: node@24.15.0
          cache: true
          require-lockfile: true
      # Root project plus each package's own tsconfig (engine, engine-api and
      # engine-lib get no DOM and no Node types).
      - run: pnpm run typecheck
      - run: pnpm run build-prod
      - uses: actions/upload-artifact@v7
        with:
          path: out/index.html
          retention-days: 1
  # Private-repo runners have 2 vCPUs, so the suite runs in 4 shards.
  test:
    name: 🔬 Test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/setup@v3
        with:
          version: 11.1.0
          runtime: node@24.15.0
          cache: true
          require-lockfile: true
      - run: pnpm test --shard=${{ matrix.shard }}/4

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.1.0
          runtime: node@24.15.0
          cache: true
          require-lockfile: true
      - run: pnpm run lint:github

  prettier:
    name: 🎨 Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.1.0
          runtime: node@24.15.0
          cache: true
          require-lockfile: true
      - run: pnpm run format:check

  gen-maps:
    name: 🗺️ Generated maps up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.1.0
          runtime: node@24.15.0
          cache: true
          require-lockfile: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: map-generator/go.mod
          cache-dependency-path: map-generator/go.sum
      - run: pnpm run gen-maps
      - name: Check for diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated maps are out of date — run 'npm run gen-maps' and commit the result."
            git status --short
            git --no-pager diff
            exit 1
          fi
